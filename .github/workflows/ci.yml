name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Build and smoke-test the wheel against the demo server
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          mcp-auth-doctor --version
          python scripts/demo_server.py --port 8765 &
          python scripts/demo_server.py --port 8766 --broken &
          sleep 2
          mcp-auth-doctor http://127.0.0.1:8765/mcp --dcr-probe
          if mcp-auth-doctor http://127.0.0.1:8766/mcp --json > broken.json; then echo "expected exit 1"; exit 1; fi
          python -c "import json; d=json.load(open('broken.json')); assert d['summary']['exit_code']==1; assert any(c['id']=='prm-resource' and c['status']=='fail' for c in d['checks'])"
